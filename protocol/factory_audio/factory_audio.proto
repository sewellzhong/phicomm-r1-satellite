syntax = "proto3";

package r1.factory_audio.v1;

option java_package = "dev.sewellzhong.r1probe.factoryaudio.proto";
option java_outer_classname = "FactoryAudio";

enum CaptureState {
  CAPTURE_STATE_UNSPECIFIED = 0;
  CAPTURE_STATE_IDLE = 1;
  CAPTURE_STATE_STREAMING = 2;
  CAPTURE_STATE_FAILED = 3;
}

enum ReferenceState {
  REFERENCE_STATE_UNSPECIFIED = 0;
  REFERENCE_STATE_UNAVAILABLE = 1;
  REFERENCE_STATE_ACTIVE = 2;
  REFERENCE_STATE_STALE = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNAVAILABLE = 1;
  ERROR_CODE_PERMISSION_DENIED = 2;
  ERROR_CODE_BACKEND_FAILURE = 3;
  ERROR_CODE_FORMAT_MISMATCH = 4;
  ERROR_CODE_PROTOCOL_MISMATCH = 5;
  ERROR_CODE_BUSY = 6;
  ERROR_CODE_INVALID_REQUEST = 7;
}

message AudioFormat {
  uint32 sample_rate_hz = 1;
  uint32 channels = 2;
  uint32 sample_width_bytes = 3;
  uint32 frame_duration_ms = 4;
}

message Hello {
  uint32 minimum_version = 1;
  uint32 maximum_version = 2;
  string client_name = 3;
}

message HelloReply {
  uint32 selected_version = 1;
  string agent_version = 2;
  string backend_name = 3;
}

message StartCapture {
  AudioFormat format = 1;
  bool include_diagnostic_output = 2;
  // Bounded validation only. The agent also requires an explicit boot-time
  // allow flag; production capture must leave this false.
  bool vendor_debug_files = 3;
}

message StopCapture {}
message GetHealth {}

message Health {
  CaptureState capture_state = 1;
  ReferenceState reference_state = 2;
  string backend_name = 3;
  uint64 frames_sent = 4;
  uint64 frames_dropped = 5;
  string failure_reason = 6;
  string vendor_board_version = 7;
  uint32 raw_mic_channels = 8;
  uint32 aec_reference_channels = 9;
  bool array_processing_active = 10;
  bool aec_active = 11;
  // Vendor topology/configuration only. These fields never attest playback
  // reference coverage or cancellation in the emitted stream.
  uint32 configured_aec_reference_channels = 12;
  bool aec_configured = 13;
  bool vendor_debug_files_active = 14;
}

message AudioFrame {
  uint64 sequence = 1;
  uint64 monotonic_time_ns = 2;
  bytes pcm_s16le = 3;
  uint64 dropped_frames = 4;
  sint32 doa_degrees = 5;
  bool doa_valid = 6;
  ReferenceState reference_state = 7;
  // Validation-only copy of the vendor backend's complete interleaved output.
  // Satellite consumers must continue to use pcm_s16le above.
  bytes diagnostic_interleaved_pcm_s16le = 8;
  uint32 diagnostic_output_channels = 9;
  uint32 diagnostic_selected_output_channel = 10;
}

message PlaybackReference {
  uint64 sequence = 1;
  uint64 monotonic_time_ns = 2;
  bytes pcm_s16le = 3;
  string source = 4;
}

message Event {
  string name = 1;
  string detail = 2;
}

message Error {
  ErrorCode code = 1;
  string detail = 2;
}

message Envelope {
  uint32 protocol_version = 1;
  uint64 request_id = 2;
  oneof payload {
    Hello hello = 10;
    HelloReply hello_reply = 11;
    StartCapture start_capture = 12;
    StopCapture stop_capture = 13;
    GetHealth get_health = 14;
    Health health = 15;
    AudioFrame audio_frame = 16;
    PlaybackReference playback_reference = 17;
    Event event = 18;
    Error error = 19;
  }
}
